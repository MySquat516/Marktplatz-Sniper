[project]
name = "marktplatz-sniper"
version = "0.1.0"
description = "Beobachtet Suchen auf eBay, Kleinanzeigen und willhaben und meldet neue Anzeigen"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "curl_cffi>=0.7",
    "beautifulsoup4>=4.12",
    "apprise>=1.9",
    "requests>=2.31",
    "waitress>=3.0",
    "tzdata>=2024.1",
]

[project.scripts]
sniper = "sniper.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sniper"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# Warnung aus der Apprise-Bibliothek selbst, nicht aus unserem Code
filterwarnings = ["ignore:'imghdr' is deprecated:DeprecationWarning"]
