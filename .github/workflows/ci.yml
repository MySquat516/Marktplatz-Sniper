name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Abhängigkeiten installieren
        run: uv sync --frozen
      - name: Tests
        run: uv run pytest
      - name: Linting
        run: uv run ruff check .
      - name: Formatierung
        run: uv run ruff format --check .
